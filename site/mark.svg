<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- the trainer's mark · placeholder until the Higgsfield 3D render. A glossy burgundy ceramic kettlebell
       with two eyes: a wide flat-topped handle whose horns flare out and sink into the shoulders of a round
       bell with a flat base, so it reads as a kettlebell and never as a padlock.
       Swap: drop mark.webp beside this file and change the one href in index.html (#agent-mark). -->
  <defs>
    <radialGradient id="glaze" cx="36%" cy="34%" r="74%">
      <stop offset="0" stop-color="#C2506C"/>
      <stop offset=".38" stop-color="#8E2440"/>
      <stop offset=".8" stop-color="#5A1424"/>
      <stop offset="1" stop-color="#420C12"/>
    </radialGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B0405C"/>
      <stop offset=".6" stop-color="#7A1D36"/>
      <stop offset="1" stop-color="#5A1424"/>
    </linearGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2B1A1C" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2B1A1C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="32" cy="60" rx="21" ry="3" fill="url(#floor)"/>
  <!-- handle: wide, flat on top, horns flaring out then down into the bell -->
  <path d="M14.5 33 C12.5 25 12.8 16.5 18 12.6 C20 11.2 22.5 10.8 25 10.8 H39 C41.5 10.8 44 11.2 46 12.6 C51.2 16.5 51.5 25 49.5 33"
        fill="none" stroke="url(#handle)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M17 24 C16.6 19.5 17.6 15.8 20.6 14.2 C22 13.6 23.4 13.4 25 13.4 H33" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.4" stroke-linecap="round"/>
  <!-- bell: round, wider than tall, with a flat base -->
  <path d="M32 25 C46.5 25 55 33.5 55 43.5 C55 50 52 54.6 47.6 57.4 H16.4 C12 54.6 9 50 9 43.5 C9 33.5 17.5 25 32 25 Z" fill="url(#glaze)"/>
  <path d="M17.5 57.4 H46.5 C45 58.8 43 59.2 41 59.2 H23 C21 59.2 19 58.8 17.5 57.4 Z" fill="#420C12"/>
  <!-- glaze: the soft bloom and the hard window highlight -->
  <ellipse cx="22" cy="34" rx="9" ry="5.6" fill="url(#shine)" opacity=".55" transform="rotate(-26 22 34)"/>
  <path d="M15.6 37 C16.6 32.8 19.6 29.8 23.4 28.6" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M49 47.5 C48.4 50.8 46.8 53.4 44.6 55" fill="none" stroke="#F2E7E6" stroke-opacity=".28" stroke-width="1.5" stroke-linecap="round"/>
  <!-- the face -->
  <ellipse cx="25.5" cy="43" rx="3" ry="3.6" fill="#1A0507"/>
  <ellipse cx="38.5" cy="43" rx="3" ry="3.6" fill="#1A0507"/>
  <circle cx="26.5" cy="41.7" r="1" fill="#fff"/>
  <circle cx="39.5" cy="41.7" r="1" fill="#fff"/>
  <path d="M29.6 49 q2.4 1.9 4.8 0" fill="none" stroke="#1A0507" stroke-width="1.5" stroke-linecap="round"/>
</svg>
